name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and module policy
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Check formatting
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-ed:"
            echo "$out"
            exit 1
          fi
      - name: Verify module graph
        shell: bash
        run: |
          test "$(find . -name go.mod -print | wc -l | tr -d ' ')" = "1"
          test "$(find . -name go.sum -print | wc -l | tr -d ' ')" = "1"
          if go list -m all | grep -q 'github.com/dlclark/regexp2'; then
            echo 'github.com/dlclark/regexp2 must not enter the module graph'
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2"
          install-go: false

  test:
    name: Test ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22.12", stable]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test -count=1 ./...

  linux-386:
    name: Test linux/386
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOARCH: "386"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.12"
      - name: Install 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Test
        run: go test -count=1 ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test with race detector
        run: go test -race -count=1 ./...

  no-cgo:
    name: No-cgo compile
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.12"
      - name: Compile packages and tests
        run: go test -run '^$' ./...

  nodejs-types:
    name: NodeJS type definitions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - name: Test workspaces
        run: |
          npm ci
          npm test --workspaces

  tc39:
    name: TC39
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Checkout TC39 tests
        run: ./.tc39_test262_checkout.sh
      - name: Run test suite
        run: go test -count=1 ./...
